<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub ユーザー検索ツール</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 p-8">

  <div class="mx-auto max-w-md rounded-2xl bg-white p-6 shadow-md">
    <header class="mb-6">
      <h1 class="text-xl font-bold text-slate-900">GitHub ユーザー検索</h1>
      <p class="mt-1 text-sm text-slate-500">ユーザー名を入力して情報を取得します</p>
    </header>

    <!-- 入力フォームエリア -->
    <div class="mb-6 flex gap-2">
      <input
        type="text"
        id="usernameInput"
        placeholder="例: octocat"
        class="w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-800 focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
      />
      <button
        id="searchBtn"
        class="shrink-0 rounded-lg bg-blue-600 px-4 py-2 font-medium text-white hover:bg-blue-700 transition-colors"
      >
        検索
      </button>
    </div>

    <!-- メッセージ表示エリア -->
    <p id="status" class="mb-4 text-sm text-slate-500"></p>

    <!-- ユーザー情報表示カード -->
    <div id="userCard" class="hidden rounded-xl border border-slate-200 bg-slate-50 p-4 text-center">
      <img
        id="avatar"
        src=""
        alt="アバター画像"
        class="mx-auto h-24 w-24 rounded-full border-2 border-white shadow-sm mb-3"
      />
      <h2 id="userName" class="text-lg font-bold text-slate-900"></h2>
      <p id="userBio" class="mt-1 text-sm text-slate-600"></p>
      <div class="mt-4 inline-block rounded-full bg-blue-50 px-3 py-1 text-xs font-semibold text-blue-700">
        フォロワー: <span id="followerCount">0</span> 人
      </div>
    </div>
  </div>

  <script>
    const usernameInput = document.getElementById("usernameInput");
    const searchBtn = document.getElementById("searchBtn");
    const status = document.getElementById("status");
    const userCard = document.getElementById("userCard");

    const avatar = document.getElementById("avatar");
    const userName = document.getElementById("userName");
    const userBio = document.getElementById("userBio");
    const followerCount = document.getElementById("followerCount");

    // ユーザー情報を取得して表示する async 関数
    async function fetchGitHubUser() {
      const username = usernameInput.value.trim();

      // 入力欄が空の場合は初期化して終了
      if (!username) {
        status.textContent = "ユーザー名を入力してください";
        userCard.classList.add("hidden");
        return;
      }

      // UIの状態をリセット
      status.textContent = "取得中...";
      userCard.classList.add("hidden");

      try {
        // GitHub API へリクエスト送信
        const response = await fetch(`https://api.github.com/users/${username}`);

        // レスポンスが ok でない場合（404エラーなど）
        if (!response.ok) {
          throw new Error("ユーザーが見つかりませんでした");
        }

        const data = await response.json();

        // 取得したデータを画面にセット
        avatar.src = data.avatar_url;
        userName.textContent = data.name || data.login; // name が null の場合は login名 を表示
        userBio.textContent = data.bio || "自己紹介文はありません";
        followerCount.textContent = data.followers;

        // 表示の切り替え
        status.textContent = "";
        userCard.classList.remove("hidden");

      } catch (error) {
        console.error("エラー詳細:", error);
        status.textContent = error.message === "ユーザーが見つかりませんでした" 
          ? "ユーザーが見つかりませんでした" 
          : "通信エラーが発生しました";
      }
    }

    // ボタンクリックイベント
    searchBtn.addEventListener("click", fetchGitHubUser);

    // Enterキーでも検索できるように設定
    usernameInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        fetchGitHubUser();
      }
    });
  </script>
</body>
</html>
